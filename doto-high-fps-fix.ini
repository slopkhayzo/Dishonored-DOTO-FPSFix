[Fix]
; Let an external driver or RTSS limiter control render FPS above 120.
; Keep swap-chain Triple Buffering disabled and always use a safe external cap.
UnlockAbove120=1

; Make the turn per mouse count independent of the frame rate, above and below
; 120 FPS: the game's own look scaling divides by the simulation time step
; instead of the real frame time. Sensitivity then matches the unmodified game
; at its normal 120 FPS cap; if you raised the in-game sensitivity for an older
; version of this patch, lower it back to about half.
StabilizeMouseSensitivity=1

; Predict only the renderer-owned camera between the game's 120 Hz updates.
; Press F10 in-game for a live prediction on/off comparison.
StabilizeCamera=1

; With StabilizeCamera=1, predict camera rotation from the real time since the
; game last applied mouse look, while position keeps the simulation-time
; prediction. Mouse turning then stays even at frame rates that are not a
; multiple of 120 (for example 90 or 144 FPS). Cutscenes and menus keep the
; simulation-time rotation prediction. Ctrl+F10 switches between the two
; rotation rules in game for an A/B comparison. Set this to 0 to always use
; the simulation-time rule.
RealTimeTurnPrediction=1

; Correct temporary first-person GPU matrices using the camera delta.
; Renderer-only hands/weapons correction passed focused live validation.
StabilizeFirstPersonHands=1

[Interpolation]
; World, first-person, and cinematic interpolation passed focused and
; multi-level live testing. Each layer remains independently configurable.

; Smooth eligible rigid, uniform-scaled, or stable-reflection world roots in a
; temporary render-model clone. Entity and physics transforms are untouched.
WorldTransforms=1

; Smooth small exact-skinned ownerless cinematic controls. Cloth is not covered.
CinematicTransforms=1

; Reserved and forced off in the DOTO build. D2's attempted shadow boundary was
; rejected during live validation and no coherent DOTO boundary is mapped.
ShadowTransforms=0

; Smooth depth-hacked first-person bone palettes independently of the root fix.
; With StabilizeFirstPersonHands=1 it also smooths first-person models that
; move relative to the camera, such as the held weapon following the animated
; hand; models fixed to the camera keep that option's plain camera correction.
FirstPersonSkeletons=1

; Smooth selected ordinary world skeletal palettes and aligned skinned roots.
WorldSkeletons=1

; Smooth small exact-skinned ownerless cinematic palettes (maximum 64 joints).
CinematicSkeletons=1

; Dynamically sheds transform interpolation first, then skeletal interpolation,
; when measured fixed-step/presentation cadence lacks useful 120 Hz headroom.
; Recovery uses the locally observed cost of each family, two-window hysteresis,
; and a controlled re-probe when a much lighter scene makes an old cost stale.
; A layer whose removal does not make frames faster, as under an external
; frame cap, is restored at once and kept on. Each level load restarts the
; gate with every layer on and measures the new level after a 5 s warm-up.
; This order is based on same-session DOTO A/B captures: transforms were the
; more expensive family in the medium and heavy Follow the Ink test scenes.
; F11/Alt+F11 manual selection suspends the controller until the next launch.
; Set this to 0 to keep every individually enabled interpolation layer eligible
; continuously, regardless of measured performance.
AdaptivePerformanceGate=1

; Keep every enabled interpolation layer active during cutscenes (the game's
; cinematic state, such as vehicle rides), even when the adaptive gate would
; shed layers there; cutscene frames are also excluded from its measurements.
; After the cutscene the gate resumes its gameplay decision. Set this to 0 to
; let the adaptive gate manage cutscenes like gameplay.
FullInterpolationInCutscenes=1

; Keep every enabled interpolation layer active while the game slows time,
; even when the adaptive gate would shed layers; those frames are also
; excluded from its measurements. Slow motion is read from the engine clock's
; time scales. Set this to 0 to let the adaptive gate manage slow motion like
; normal play.
FullInterpolationInSlowMotion=1

[Diagnostics]
; Publish camera/timing samples through a named shared-memory block.
Telemetry=0

; Development-only performance probe. Ctrl+F11 starts/stops a measurement;
; F11 toggles all configured interpolation; Alt+F11 cycles All -> Transforms
; only -> Skeletons only -> Off; Shift+F11 isolates first-person root work.
; Each segment discards a two-second warm-up and writes bounded results to the
; log. Keep this 0 for ordinary play.
InterpolationABProbe=0

; Log the engine clock's time scales when they change and summarize each
; detected slow-motion period (a few lines per event). Set this to 0 to omit
; these lines.
TimeScaleLog=1
